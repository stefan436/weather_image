name: Build and Deploy Weather App

on:

  schedule:
    - cron: '0 6 * * *'       # Täglicher DWD-Lauf
    - cron: '45 4-20 * * *'   # Stündliche Widget-Updates
  workflow_dispatch:

# Diese Berechtigungen sind zwingend erforderlich, damit GitHub Actions die Webseite deployen darf
permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert, dass zwei Deployments gleichzeitig laufen und sich gegenseitig stören
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Repository klonen
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 🔧 Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install requests xarray cfgrib numpy

      # - name: ▶️ Wetter-Widget-Daten generieren (JSON)
      #   run: python create_widget_info.py

      - name: ▶️ DWD UV & PT Daten generieren (BIN + JSON)
        run: |
          mkdir -p downloads
          python process_dwd_uv_and_pt.py

      - name: ▶️ MOSMIX-S Daten generieren
        run: python process_mosmix_s.py

      - name: 📤 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Build Artifact (docs-Ordner verpacken)
        uses: actions/upload-pages-artifact@v3
        with:
          # Wir laden nur den docs/-Ordner hoch, der jetzt alle generierten Daten enthält
          path: './docs'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4