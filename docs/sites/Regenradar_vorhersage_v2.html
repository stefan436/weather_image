<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <title>RV Komposit & KONRAD3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/leaflet-ellipse@0.9.1/l.ellipse.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chroma-js@2.4.2/chroma.min.js"></script>

  <link rel="stylesheet" href="./../styles/global.css">
  <link rel="stylesheet" href="./../styles/Hamburgermenu.css">
  <link rel="stylesheet" href="./../styles/Regenradare.css" />
</head>
<body>
  <header>
    <!-- NavBar und Hamburgermenue -->
    <div id="navbar-placeholder"></div>
  </header>
  <div id="controls">
    <button id="start">Daten laden & animieren</button>
    <p id="location_output"></p>

    <span id="frameLabel">---</span>
    <input id="frameSlider" type="range" min="0" max="24" value="0" style="width:300px;" disabled />
    <button id="playPause" disabled>▶️ Play</button>
  </div>

  <div id="map"></div>

  <div id="legend" class="legend" style="display:none;">
    <div id="legend-hint" style="font-size:12px; color:#444; margin-bottom: 6px;">
      ℹ️ Tippe auf den Regen für Details
    </div>
    
    <div id="legend-click" style="font-size:14px; display:none; margin-bottom: 6px;">
      <span id="clickColorBox" style="display:inline-block; width:16px; height:16px; border:1px solid #ccc; vertical-align:middle; margin-right:6px;"></span>
      <span id="clickValue" style="font-weight:bold;"></span>
    </div>
    <div style="font-size:10px; margin-top:8px; color:#444;">
      Quelle: Deutscher Wetterdienst, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>
    </div>
  </div>


  <script type="module" src="./../scripts/radarv2/main.js"></script>
</body>
</html>
